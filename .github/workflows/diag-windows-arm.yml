name: Diag windows/arm64 cgo toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-11-arm
    steps:
      - name: Checkout plugin store
        uses: actions/checkout@v4

      - name: Checkout CLIProxyAPI for replace directive
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          path: CLIProxyAPI

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Update go.mod replace path
        shell: bash
        run: |
          WORKSPACE="${{ github.workspace }}"
          WORKSPACE="${WORKSPACE//\\//}"
          sed -i.bak "s|replace github.com/router-for-me/CLIProxyAPI/v7 => .*|replace github.com/router-for-me/CLIProxyAPI/v7 => ${WORKSPACE}/CLIProxyAPI|" plugins/codex-oauth-base-url/go/go.mod
          rm -f plugins/codex-oauth-base-url/go/go.mod.bak

      - name: Install aarch64 mingw clang
        shell: bash
        run: |
          time /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-clang-aarch64-toolchain 2>&1 | tail -15
          echo "=== installed clang ==="
          ls /c/msys64/clangarm64/bin/clang* 2>/dev/null || echo "(still missing)"

      - name: Candidate builds
        shell: bash
        working-directory: plugins/codex-oauth-base-url/go
        run: |
          set +e
          try() {
            local name="$1"; shift
            rm -f out.dll out.h
            echo ""
            echo "===== ${name} ====="
            ( env CGO_ENABLED=1 GOOS=windows GOARCH=arm64 "$@" go build -buildmode=c-shared -o out.dll . ) > /tmp/log.txt 2>&1
            local rc=$?
            if [ $rc -eq 0 ] && [ -f out.dll ]; then
              echo "RESULT: OK"
              python3 -c "
          import struct
          d = open('out.dll','rb').read(0x400)
          off = struct.unpack_from('<I', d, 0x3C)[0]
          m = struct.unpack_from('<H', d, off + 4)[0]
          print('PE machine:', hex(m), {0x8664:'x86_64', 0xAA64:'arm64'}.get(m,'unknown'))
          "
            else
              echo "RESULT: FAIL rc=$rc"
              tail -8 /tmp/log.txt
            fi
            rm -f out.dll out.h
          }

          export PATH="/c/msys64/clangarm64/bin:$PATH"
          echo "=== clangarm64 clang version ==="
          /c/msys64/clangarm64/bin/clang --version 2>&1 | head -3
          try "CC=clangarm64 clang (default target)" CC="C:/msys64/clangarm64/bin/clang"
          try "CC=clangarm64 clang + export-all-symbols" CC="C:/msys64/clangarm64/bin/clang" GOFLAGS="-ldflags=-extldflags=-Wl,--export-all-symbols"
