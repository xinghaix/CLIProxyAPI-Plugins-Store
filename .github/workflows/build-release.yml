# Release tags are plugin-scoped: <plugin-id>-v<version>.
#
# Each plugin owns an independent version line, so a number is never shared across
# plugins: a new plugin can start at 0.1.0 even though v0.1.0 already belongs to
# another plugin's release. The workflow builds exactly the plugin named in the tag.
#
# The shared v<version> release train was retired on 2026-09-18 and is rejected.
#
# Before tagging, the plugin's version must be bumped in:
#   1. plugins/<id>/go/main.go   -> var pluginVersion = "1.2.0"
#   2. plugins.json              -> "version": "1.2.0"
#   3. plugins/<id>/Makefile     -> VERSION := 1.2.0 (if exists)
# The workflow reads var pluginVersion from each plugin's source and only
# builds plugins whose hardcoded version matches the tag version.
# A release contains only the matching plugins' platform zips + checksums.
#
# schema v2 only: plugins.json is the source manifest and registry-v2.json is
# the single published registry (direct install). The legacy schema v1
# registry is no longer produced or served.
# The cdn branch mirrors registry-v2.json + release assets for jsDelivr.

name: Build and Release Matching Plugins

on:
  push:
    tags:
      # plugin-scoped releases only, e.g. cursor-oauth-v0.6.1 or codex-oauth-base-url-v0.1.0
      - "*-v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Plugin-scoped release tag to build (e.g. cursor-oauth-v0.6.1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  GO_VERSION: "1.27.1"
  NODE_VERSION: "22"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.list.outputs.tag }}
      version: ${{ steps.list.outputs.version }}
      plugin_ids: ${{ steps.list.outputs.plugin_ids }}
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag targets main history
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "tag ${GITHUB_REF_NAME} does not target a commit in main history" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} targets main commit ${TAG_COMMIT}"

      - id: list
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"

          # <plugin-id>-v<version>, e.g. cpa-manager-plus-v0.5.29
          if [[ "$TAG" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+([+][0-9A-Za-z.-]+)?)$ ]]; then
            SCOPED_PLUGIN="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
          else
            echo "invalid tag: $TAG" >&2
            echo "tags must be <plugin-id>-v<version>, e.g. cpa-manager-plus-v0.5.29" >&2
            echo "the shared v<version> release train was retired on 2026-09-18" >&2
            exit 1
          fi

          PLUGINS=$(find plugins -type f -path '*/go/go.mod' | sed 's|/go/go.mod$||;s|^plugins/||' | sort -u)
          if [ -z "$PLUGINS" ]; then
            echo "no plugins under plugins/*/go" >&2
            exit 1
          fi

          if ! printf '%s\n' "$PLUGINS" | grep -qx "$SCOPED_PLUGIN"; then
            echo "tag $TAG names plugin $SCOPED_PLUGIN, but plugins/${SCOPED_PLUGIN}/go/go.mod does not exist" >&2
            exit 1
          fi

          MATCHING_PLUGINS=""
          ALL_VERSIONS=""
          for pid in $PLUGINS; do
            pv=$(grep -oP 'var pluginVersion\s*=\s*"\K[^"]+' "plugins/${pid}/go/main.go" 2>/dev/null || echo '')
            if [ -z "$pv" ]; then
              echo "WARNING: cannot read version from plugins/${pid}/go/main.go" >&2
              continue
            fi
            ALL_VERSIONS="${ALL_VERSIONS}  ${pid}: ${pv}\n"
            if [ "$pid" = "$SCOPED_PLUGIN" ]; then
              if [ "$pv" != "$VERSION" ]; then
                echo "plugins/${pid}/go/main.go declares $pv, but tag $TAG says $VERSION" >&2
                exit 1
              fi
              MATCHING_PLUGINS="$MATCHING_PLUGINS $pid"
            fi
          done

          MATCHING_PLUGINS=$(echo "$MATCHING_PLUGINS" | xargs -n1 | sort -u | xargs)
          if [ -z "$MATCHING_PLUGINS" ]; then
            echo "no plugin has version $VERSION in source" >&2
            echo "available plugin versions:" >&2
            printf "%b" "$ALL_VERSIONS" >&2
            exit 1
          fi

          echo "tag version: $VERSION"
          echo "matching plugins: $MATCHING_PLUGINS"
          printf "%b" "$ALL_VERSIONS"

          ENTRIES=""
          for pid in $MATCHING_PLUGINS; do
            for pair in "linux:amd64:ubuntu-latest:so" "linux:arm64:ubuntu-24.04-arm:so" "darwin:amd64:macos-latest:dylib" "darwin:arm64:macos-latest:dylib" "windows:amd64:windows-latest:dll" "windows:arm64:windows-11-arm:dll"; do
              IFS=':' read -r goos goarch runner ext <<< "$pair"
              ENTRIES="${ENTRIES}{\"plugin_id\":\"$pid\",\"goos\":\"$goos\",\"goarch\":\"$goarch\",\"runner\":\"$runner\",\"ext\":\"$ext\"},"
            done
          done
          ENTRIES="${ENTRIES%,}"
          MATRIX="{\"include\":[$ENTRIES]}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "plugin_ids=$MATCHING_PLUGINS" >> "$GITHUB_OUTPUT"
          {
            echo 'matrix<<MATRIX_EOF'
            echo "$MATRIX"
            echo 'MATRIX_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "jobs: $(echo "$MATRIX" | jq '.include | length')"

  build:
    name: ${{ matrix.plugin_id }} ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: discover
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout plugin store
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install aarch64 mingw toolchain
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: bash
        run: |
          # The runner's default clang targets aarch64-pc-windows-msvc, and the
          # msvc driver does not understand the -mthreads flag that Go always
          # passes on Windows. Install the mingw-w64 aarch64 toolchain (target
          # aarch64-w64-windows-gnu) and build with that clang instead.
          /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-clang-aarch64-toolchain
          echo "C:/msys64/clangarm64/bin" >> "$GITHUB_PATH"

      - name: Download pinned Go dependencies
        working-directory: plugins/${{ matrix.plugin_id }}/go
        shell: bash
        run: go mod download

      - name: Build plugin web assets
        working-directory: plugins/${{ matrix.plugin_id }}
        shell: bash
        run: |
          if [ -f web/package.json ]; then
            cd web
            npm ci
            npm run build
          else
            echo "no web/package.json for ${{ matrix.plugin_id }}, skipping web build"
          fi

      - name: Build plugin
        working-directory: plugins/${{ matrix.plugin_id }}/go
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ (matrix.goos == 'windows' && matrix.goarch == 'arm64') && 'C:/msys64/clangarm64/bin/clang' || '' }}
        run: |
          PLUGIN_ID="${{ matrix.plugin_id }}"
          VERSION="${{ needs.discover.outputs.version }}"
          OUTPUT="${PLUGIN_ID}-v${VERSION}.${{ matrix.ext }}"
          LDFLAGS="-X main.pluginVersion=${VERSION}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -buildmode=c-shared -ldflags="${LDFLAGS} -extldflags=-Wl,--export-all-symbols" -o "$OUTPUT" .
          else
            go build -buildmode=c-shared -ldflags="${LDFLAGS}" -o "$OUTPUT" .
          fi
          file "$OUTPUT" || true

      - name: Verify exported ABI symbol
        working-directory: plugins/${{ matrix.plugin_id }}/go
        shell: bash
        run: |
          PLUGIN_ID="${{ matrix.plugin_id }}"
          VERSION="${{ needs.discover.outputs.version }}"
          LIB="${PLUGIN_ID}-v${VERSION}.${{ matrix.ext }}"
          # go tool nm reads Mach-O, PE, and ELF, so it works on every runner.
          SYMS=/tmp/plugin-symbols.txt
          if ! go tool nm "$LIB" > "$SYMS" 2>/dev/null && ! nm "$LIB" > "$SYMS" 2>/dev/null; then
            echo "WARNING: no symbol reader could parse $LIB; skipping export check"
            exit 0
          fi
          # grep a file rather than a pipe: grep -q closes early and the
          # resulting SIGPIPE would fail the step under pipefail.
          if grep -Eq '^[[:space:]]*[0-9a-fA-F]+[[:space:]]+[TD][[:space:]]+_?cliproxyPluginCall$' "$SYMS"; then
            echo "OK: cliproxyPluginCall exported by $LIB"
          else
            echo "ERROR: cliproxyPluginCall not exported by $LIB" >&2
            grep -i cliproxy "$SYMS" >&2 || true
            exit 1
          fi

      - name: Package zip
        working-directory: plugins/${{ matrix.plugin_id }}/go
        shell: bash
        run: |
          PLUGIN_ID="${{ matrix.plugin_id }}"
          VERSION="${{ needs.discover.outputs.version }}"
          LIB="${PLUGIN_ID}-v${VERSION}.${{ matrix.ext }}"
          ZIP_NAME="${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          rm -f "$ZIP_NAME"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "$ZIP_NAME" "$LIB"
          else
            zip -j "$ZIP_NAME" "$LIB"
          fi
          if command -v shasum &>/dev/null; then
            shasum -a 256 "$ZIP_NAME" >> checksums_fragment.txt
          else
            sha256sum "$ZIP_NAME" >> checksums_fragment.txt
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin_id }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            plugins/${{ matrix.plugin_id }}/go/*.zip
            plugins/${{ matrix.plugin_id }}/go/checksums_fragment.txt

  release:
    name: Release ${{ needs.discover.outputs.tag }}
    runs-on: ubuntu-latest
    needs: [discover, build]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge checksums
        run: |
          find artifacts -name 'checksums_fragment.txt' -exec cat {} \; | sort -u > checksums.txt
          wc -l checksums.txt
          cat checksums.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.discover.outputs.tag }}
          name: ${{ needs.discover.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            checksums.txt

  update-v2-registry:
    name: Refresh schema v2 direct registry
    runs-on: ubuntu-latest
    needs: [discover, release]
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare registry update branch
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.discover.outputs.tag }}"
          REGISTRY_BRANCH="automation/refresh-registry-v2-${TAG}"
          if git ls-remote --exit-code --heads origin "$REGISTRY_BRANCH" >/dev/null; then
            git fetch origin "+refs/heads/${REGISTRY_BRANCH}:refs/remotes/origin/${REGISTRY_BRANCH}"
            git switch --force-create "$REGISTRY_BRANCH" "origin/${REGISTRY_BRANCH}"
          else
            git switch -c "$REGISTRY_BRANCH"
          fi
          echo "REGISTRY_BRANCH=${REGISTRY_BRANCH}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Generate registry-v2.json from released assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/generate-registry-v2.py

      - name: Commit registry-v2.json and create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- registry-v2.json; then
            echo "registry-v2.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry-v2.json
          git commit -m "chore: refresh schema v2 direct registry"
          git push origin "HEAD:${REGISTRY_BRANCH}"

          PR_URL="$(gh pr list --base main --head "$REGISTRY_BRANCH" --state open --json url --jq '.[0].url')"
          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create \
              --base main \
              --head "$REGISTRY_BRANCH" \
              --title "chore: refresh schema v2 direct registry" \
              --body "Automated registry refresh for ${TAG}.")"
          fi
          echo "REGISTRY_PR_URL=${PR_URL}" >> "$GITHUB_ENV"

      - name: Auto-merge registry pull request
        if: env.REGISTRY_PR_URL != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_MERGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_MERGE_TOKEN is required to auto-merge registry PRs past main-branch review rules"
            exit 1
          fi
          PR_URL="${REGISTRY_PR_URL}"
          PR_JSON="$(gh pr view "$PR_URL" --json baseRefName,headRefName,author,files,state)"
          BASE="$(printf '%s' "$PR_JSON" | jq -r .baseRefName)"
          HEAD="$(printf '%s' "$PR_JSON" | jq -r .headRefName)"
          AUTHOR="$(printf '%s' "$PR_JSON" | jq -r .author.login)"
          FILES="$(printf '%s' "$PR_JSON" | jq -r '[.files[].path] | join("\n")')"
          EXPECTED_HEAD="automation/refresh-registry-v2-${TAG}"
          if [ "$BASE" != "main" ]; then
            echo "refusing to merge PR based on $BASE"
            exit 1
          fi
          if [ "$HEAD" != "$EXPECTED_HEAD" ]; then
            echo "refusing to merge unexpected head $HEAD"
            exit 1
          fi
          if [ "$AUTHOR" != "github-actions[bot]" ] && [ "$AUTHOR" != "app/github-actions" ]; then
            echo "refusing to merge PR from $AUTHOR"
            exit 1
          fi
          if [ "$FILES" != "registry-v2.json" ]; then
            echo "refusing to merge PR that changes: $FILES"
            exit 1
          fi
          echo "Merging $PR_URL"
          gh pr merge --squash --admin --delete-branch "$PR_URL"
          STATE="$(gh pr view "$PR_URL" --json state --jq .state)"
          if [ "$STATE" != "MERGED" ]; then
            echo "expected MERGED, got $STATE"
            exit 1
          fi

  publish-cdn:
    name: Publish jsDelivr CDN branch
    runs-on: ubuntu-latest
    needs: [discover, update-v2-registry]
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare CDN files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_FILES="$RUNNER_TEMP/release-files"
          mkdir -p "$RELEASE_FILES"
          find artifacts -name '*.zip' -exec cp {} "$RELEASE_FILES"/ \;
          find artifacts -name 'checksums_fragment.txt' -exec cat {} \; | sort -u > "$RELEASE_FILES/checksums.txt"
          test -s "$RELEASE_FILES/checksums.txt"
          ls -lh "$RELEASE_FILES"

          scripts/generate-registry-v2.py \
            --output "$RUNNER_TEMP/registry-v2-cdn.json" \
            --artifact-url-template "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@cdn/{tag}/{asset_name}"

      - name: Publish cdn branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.discover.outputs.tag }}"
          RELEASE_FILES="$RUNNER_TEMP/release-files"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd "$RUNNER_TEMP"
          rm -rf plugin-store-cdn
          if git clone --depth 1 --branch cdn "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" plugin-store-cdn 2>/dev/null; then
            cd plugin-store-cdn
          else
            mkdir plugin-store-cdn
            cd plugin-store-cdn
            git init
            git checkout -b cdn
          fi

          rm -rf "$TAG" latest
          mkdir -p "$TAG" latest
          cp "$RELEASE_FILES"/* "$TAG"/
          cp "$RELEASE_FILES"/* latest/

          # schema v1 is retired: make sure a previously published registry.json
          # does not linger on this branch.
          rm -f registry.json
          cp "$RUNNER_TEMP/registry-v2-cdn.json" registry-v2.json
          {
            printf '%s\n' "# CLIProxyAPI Plugins Store CDN branch"
            printf '%s\n' ""
            printf '%s\n' "This branch is generated by GitHub Actions. Do not edit it manually."
            printf '%s\n' ""
            printf '%s\n' "- \`registry-v2.json\` is the schema v2 direct-install registry with jsDelivr artifact URLs."
            printf '%s\n' "- \`vX.Y.Z/\` contains immutable release assets for that tag."
            printf '%s\n' "- \`latest/\` contains the most recently published release assets."
            printf '%s\n' ""
            printf '%s\n' "Recommended jsDelivr registry for CPA v7.2.46+:"
            printf '%s\n' ""
            printf '%s\n' "\`\`\`text"
            printf '%s\n' "https://cdn.jsdelivr.net/gh/xinghaix/CLIProxyAPI-Plugins-Store@cdn/registry-v2.json"
            printf '%s\n' "\`\`\`"
          } > README.md

          git add .
          if git diff --cached --quiet; then
            echo "CDN branch already up to date"
            exit 0
          fi
          git commit -m "Publish ${TAG} CDN files"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:cdn

      - name: Purge jsDelivr mutable CDN paths
        run: |
          set -euo pipefail
          # registry.json is listed because it was removed from the branch: purging it
          # flushes the retired schema v1 file out of the jsDelivr cache.
          paths=("registry.json" "registry-v2.json" "latest/checksums.txt")
          while IFS= read -r file; do
            paths+=("latest/$(basename "$file")")
          done < <(find "$RUNNER_TEMP/release-files" -name '*.zip' | sort)

          for path in "${paths[@]}"; do
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@cdn/${path}"
            echo "purge $url"
            curl -fsS "$url" || true
          done
