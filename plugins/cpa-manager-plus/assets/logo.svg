<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Outer solid dark squircle base -->
  <rect width="512" height="512" rx="115" fill="#0F172A" />

  <!-- Inner white dashboard card surface -->
  <rect x="14" y="14" width="484" height="484" rx="105.2" fill="#FFFFFF" />

  <!-- Scaled chart content group centered at (256, 256) -->
  <g transform="translate(256, 256) scale(1.1415094339622642) translate(-256, -256)">
    <!-- Browser header pill -->
    <rect x="88" y="92" width="336" height="42" rx="21" fill="#F1F5F9" />
    <!-- Window dots -->
    <circle cx="122" cy="113" r="13" fill="#10B981" />
    <circle cx="158" cy="113" r="13" fill="#3B82F6" />

    <!-- Gray baseline -->
    <rect x="88" y="378" width="336" height="18" rx="9" fill="#E2E8F0" />

    <!-- Chart vertical bars -->
    <rect x="118" y="278" width="46" height="100" rx="14" fill="#93C5FD" />
    <rect x="180" y="228" width="46" height="150" rx="14" fill="#60A5FA" />
    <rect x="242" y="258" width="46" height="120" rx="14" fill="#22C55E" />

    <!-- Rising trend line -->
    <path d="M108 288 L188 205 L252 250 L346 172" fill="none" stroke="#2563EB" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Apex node on trend line -->
    <circle cx="368" cy="154" r="28" fill="#22C55E" />
    <circle cx="368" cy="154" r="10" fill="#FFFFFF" />
  </g>
</svg>