name: Diag windows/arm64 cgo toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-11-arm
    steps:
      - name: Inventory msys64
        shell: bash
        run: |
          echo "=== /c/msys64/clangarm64 tree (depth 2) ==="
          ls /c/msys64/clangarm64 2>/dev/null | head -20 || echo "(missing)"
          echo "=== clangarm64/bin ==="
          ls /c/msys64/clangarm64/bin 2>/dev/null | head -20 || echo "(no bin)"
          echo "=== pacman ==="
          ls /c/msys64/usr/bin/pacman* 2>/dev/null || echo "(no pacman)"
          echo "=== any aarch64 mingw anywhere ==="
          find /c/msys64 -maxdepth 3 -iname '*aarch64*mingw*' 2>/dev/null | head -5 || true
          find /c/msys64 -maxdepth 4 -name 'windows.h' 2>/dev/null | head -5 || true
          echo "=== installed via pacman? ==="
          /c/msys64/usr/bin/pacman.exe -Q 2>/dev/null | grep -i 'mingw-w64-clang-aarch64' | head -5 || echo "(none)"
